name: otobuzz
description: "Fleet Maintenance Tracker - Mobile app for small fleet owners in Indonesia managing cars and motorcycles maintenance schedules."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local database
  sqflite: ^2.4.2
  path_provider: ^2.1.5

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path: ^1.9.0
  shared_preferences: ^2.3.4

  # Backup & Restore
  share_plus: ^10.0.0
  file_picker: ^8.0.0

  # Splash screen
  flutter_native_splash: ^2.4.0

  # PDF Export
  pdf: ^3.11.0
  printing: ^5.13.0

  # Charts
  fl_chart: ^0.69.0

  # Photo
  image_picker: ^1.1.2
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Testing utilities
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4+4

  # App icon generation
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
